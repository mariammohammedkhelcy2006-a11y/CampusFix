<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="View reported campus issues on CampusFix."><title>View Reports | CampusFix</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html" aria-label="CampusFix home"><span class="brand-mark">C</span><span>Campus<span class="brand-accent">Fix</span></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button><nav id="site-nav" class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#report-form">Report Issue</a><a class="active" href="reports.html">View Reports</a></nav></div></header>
    <main class="reports-page"><section class="page-intro"><div class="container"><p class="eyebrow">Community visibility</p><h1>Campus reports</h1><p>See what students are flagging and follow the progress of issues across campus.</p></div></section>
        <section class="section reports-section"><div class="container"><div class="filter-bar"><div class="search-field"><label for="report-search">Search reports</label><input id="report-search" type="search" placeholder="Search by title or location..."></div><div class="filter-field"><label for="category-filter">Category</label><select id="category-filter"><option value="all">All categories</option><option>Electricity</option><option>Water</option><option>Facilities</option><option>Sanitation</option><option>Security</option><option>Other</option></select></div><div class="filter-field"><label for="status-filter">Status</label><select id="status-filter"><option value="all">All statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select></div></div><div class="results-heading"><h2>Recent reports</h2><span id="results-count">6 reports</span></div><div id="reports-list" class="reports-list"></div><p id="empty-reports" class="empty-state" hidden>No reports match those filters.</p></div></section></main>
    <footer class="site-footer"><div class="container footer-wrap"><a class="brand brand-footer" href="index.html"><span class="brand-mark">C</span><span>Campus<span class="brand-accent">Fix</span></span></a><p>Report it. Track it. Fix it.</p><span class="footer-copy">&#169; 2025 CampusFix</span></div></footer><script src="script.js"></script>
</body></html>
