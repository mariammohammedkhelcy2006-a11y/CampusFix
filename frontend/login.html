<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for CampusFix.">
    <title>Admin Login | CampusFix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="index.html" aria-label="CampusFix home">
                <span class="brand-mark">C</span>
                <span>Campus<span class="brand-accent">Fix</span></span>
            </a>
            <nav id="site-nav" class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="index.html#report-form">Report Issue</a>
                <a href="reports.html">View Reports</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="section login-section">
            <div class="container login-grid">
                <div class="login-copy">
                    <p class="eyebrow">Campus operations</p>
                    <h1>Admin login</h1>
                    <p>Sign in with your CampusFix admin account to manage reported issues and update their status.</p>
                </div>
                <form class="issue-form" id="login-form" novalidate>
                    <div class="form-heading"><h3>Sign in</h3><p>Use the credentials issued by your CampusFix administrator.</p></div>
                    <div class="form-group"><label for="login-email">Email</label><input id="login-email" name="login-email" type="email" autocomplete="email" required></div>
                    <div class="form-group"><label for="login-password">Password</label><input id="login-password" name="login-password" type="password" autocomplete="current-password" required></div>
                    <button class="button button-primary button-full" type="submit">Sign in</button>
                    <p class="form-message" id="login-message" role="status"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-wrap">
            <a class="brand brand-footer" href="index.html"><span class="brand-mark">C</span><span>Campus<span class="brand-accent">Fix</span></span></a>
            <p>Report it. Track it. Fix it.</p>
            <span class="footer-copy">&copy; 2025 CampusFix</span>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
